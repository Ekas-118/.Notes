name: Build MSIX

on:
  push:
    tags: ["v*"]

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      PFX_PATH: ${{ github.workspace }}\GitHubActionsWorkflow.pfx
      CERT_STORE: Cert:\CurrentUser\My
  
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: msbuild .\DotNotes.slnx /t:Restore /p:RestoreLockedMode=true /m
  
      - name: Run Unit Tests
        run: dotnet test DotNotes.Tests/DotNotes.Tests.csproj -c Release --no-restore
          
      - name: Import signing certificate
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          [IO.File]::WriteAllBytes($env:PFX_PATH, $bytes)
          $password = ConvertTo-SecureString `
            "${{ secrets.PFX_PASSWORD }}" `
            -AsPlainText `
            -Force
          $cert = Import-PfxCertificate `
            -FilePath $env:PFX_PATH `
            -CertStoreLocation $env:CERT_STORE `
            -Password $password
          Write-Host "Imported certificate:"
          Write-Host "  Subject: $($cert.Subject)"
          Write-Host "  Thumbprint: $($cert.Thumbprint)"
          Write-Host "  Has private key: $($cert.HasPrivateKey)"
          if (-not $cert.HasPrivateKey) {
            throw "Imported certificate does not have a private key."
          }
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Set package version
        run: |
          $manifestPath = "DotNotes/Package.appxmanifest"
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $parts = $version.Split('.')
          if ($parts.Count -ne 3) {
              throw "Release tag must be in the format vMAJOR.MINOR.PATCH, e.g. v1.1.0"
          }
          $packageVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          [xml]$manifest = Get-Content $manifestPath
          $identity = $manifest.Package.Identity
          if ($null -eq $identity) {
              throw "Could not find Package.Identity"
          }
          $identity.Version = $packageVersion
          $manifest.Save((Resolve-Path $manifestPath))
      
      - name: Build MSIX
        run: |
          msbuild DotNotes/DotNotes.csproj `
            /p:Configuration=Release `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="$env:CERT_THUMBPRINT" `
            /v:m `
            /m

      - name: Remove signing certificate
        if: always()
        run: |
          Remove-Item $env:PFX_PATH -Force
          Remove-Item "$env:CERT_STORE\$env:CERT_THUMBPRINT" -Force

      - name: Upload MSIX package
        uses: actions/upload-artifact@v7
        with:
          name: DotNotes-MSIX
          path: |
            DotNotes/AppPackages/**/*.msixbundle
            DotNotes/AppPackages/**/*.cer
          if-no-files-found: error
    
  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: DotNotes-MSIX
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/**/*.msixbundle
            release/**/*.cer
          generate_release_notes: true
