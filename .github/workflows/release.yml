name: Build MSIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild DotNotes.slnx /t:Restore /p:Configuration=Release

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
          [IO.File]::WriteAllBytes(
            "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx",
            $bytes
          )

      - name: Build MSIX
        run: >
          msbuild DotNotes.slnx
          /p:Configuration=Release
          /p:Platform=x64
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Always
          /p:GenerateAppxPackageOnBuild=true
          /p:GenerateAppInstallerFile=false
          /p:PackageCertificateKeyFile="${{ github.workspace }}\GitHubActionsWorkflow.pfx"
          /p:PackageCertificatePassword="${{ secrets.PFX_PASSWORD }}"

      - name: Remove certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx" -Force -ErrorAction SilentlyContinue

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: DotNotes-MSIX
          path: "**/*.msixbundle"
