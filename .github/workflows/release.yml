name: Build MSIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: >
          msbuild DotNotes.slnx
          /t:Restore
          /p:Configuration=Release
          /p:RuntimeIdentifier=win-x64
          /p:PublishReadyToRun=false
          
      - name: Import signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.BASE64_ENCODED_PFX }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "GitHubActionsWorkflow.pfx"
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $password = ConvertTo-SecureString `
            $env:PFX_PASSWORD `
            -AsPlainText `
            -Force
          $cert = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          Write-Host "Imported certificate:"
          Write-Host "  Subject: $($cert.Subject)"
          Write-Host "  Thumbprint: $($cert.Thumbprint)"
          Write-Host "  Has private key: $($cert.HasPrivateKey)"
          if (-not $cert.HasPrivateKey) {
            throw "Imported certificate does not have a private key."
          }
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          
      - name: Build MSIX
        shell: pwsh
        run: |
          msbuild DotNotes/DotNotes.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:PublishReadyToRun=false `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Always `
            /p:GenerateAppxPackageOnBuild=true `
            /p:GenerateAppInstallerFile=false `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="$env:CERT_THUMBPRINT"

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item `
            "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx" `
            -Force `
            -ErrorAction SilentlyContinue
          Remove-Item `
            "Cert:\CurrentUser\My\$env:CERT_THUMBPRINT" `
            -Force `
            -ErrorAction SilentlyContinue

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: DotNotes-MSIX
          path: DotNotes/AppPackages/
          if-no-files-found: error
    
