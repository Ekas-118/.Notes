name: Build MSIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: >
          msbuild DotNotes.slnx
          /t:Restore
          /p:Configuration=Release
          /p:RuntimeIdentifier=win-x64
          /p:PublishReadyToRun=false
          
      - name: Decode signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.BASE64_ENCODED_PFX }}
        run: |
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "GitHubActionsWorkflow.pfx"
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          Write-Host "Certificate created at:"
          Write-Host $pfxPath
          Get-Item $pfxPath | Select-Object FullName, Length

      - name: Verify certificate
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "GitHubActionsWorkflow.pfx"
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet
          )
          Write-Host "Subject: $($cert.Subject)"
          Write-Host "Issuer: $($cert.Issuer)"
          Write-Host "Thumbprint: $($cert.Thumbprint)"
          Write-Host "Has private key: $($cert.HasPrivateKey)"
          Write-Host "Not before: $($cert.NotBefore)"
          Write-Host "Not after: $($cert.NotAfter)"
          Write-Host "Enhanced Key Usage:"
          foreach ($extension in $cert.Extensions) {
            if ($extension -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
              foreach ($oid in $extension.EnhancedKeyUsages) {
                Write-Host "  $($oid.Value) - $($oid.FriendlyName)"
              }
            }
          }
          
      - name: Build MSIX
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "GitHubActionsWorkflow.pfx"
          msbuild DotNotes/DotNotes.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:PublishReadyToRun=false `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Always `
            /p:GenerateAppxPackageOnBuild=true `
            /p:GenerateAppInstallerFile=false `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$pfxPath" `
            /p:PackageCertificatePassword="$env:PFX_PASSWORD"

      - name: Remove certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx" -Force -ErrorAction SilentlyContinue

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: DotNotes-MSIX
          path: "**/*.msixbundle"
