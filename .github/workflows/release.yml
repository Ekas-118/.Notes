name: Build MSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
  
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
  
      - name: Restore
        shell: pwsh
        run: |
          msbuild DotNotes.slnx `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:PublishReadyToRun=false
  
      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test DotNotes.Tests/DotNotes.Tests.csproj `
            --configuration Release `
            --no-restore `
            --arch x64 `
            --property:Platform=x64 `
            --property:RuntimeIdentifier=win-x64 `
            --property:PublishReadyToRun=false
        
  build:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: >
          msbuild DotNotes.slnx
          /t:Restore
          /p:Configuration=Release
          /p:RuntimeIdentifier=win-x64
          /p:PublishReadyToRun=false
          
      - name: Import signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.BASE64_ENCODED_PFX }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "GitHubActionsWorkflow.pfx"
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $password = ConvertTo-SecureString `
            $env:PFX_PASSWORD `
            -AsPlainText `
            -Force
          $cert = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          Write-Host "Imported certificate:"
          Write-Host "  Subject: $($cert.Subject)"
          Write-Host "  Thumbprint: $($cert.Thumbprint)"
          Write-Host "  Has private key: $($cert.HasPrivateKey)"
          if (-not $cert.HasPrivateKey) {
            throw "Imported certificate does not have a private key."
          }
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "1.0.0"
          }
          $parts = $version.Split('.')
          if ($parts.Count -ne 3) {
            throw "Version must be MAJOR.MINOR.PATCH, e.g. v1.2.3"
          }
          $packageVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          Write-Host "Application version: $version"
          Write-Host "Package version: $packageVersion"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV

      - name: Set package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $manifestPath = "DotNotes/Package.appxmanifest"
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $parts = $version.Split('.')
          if ($parts.Count -ne 3) {
              throw "Release tag must be in the format vMAJOR.MINOR.PATCH, e.g. v1.1.0"
          }
          $packageVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          [xml]$manifest = Get-Content $manifestPath
          $identity = $manifest.Package.Identity
          if ($null -eq $identity) {
              throw "Could not find Package.Identity"
          }
          Write-Host "Package version: $($identity.Version) -> $packageVersion"
          $identity.Version = $packageVersion
          $manifest.Save((Resolve-Path $manifestPath))
          
      - name: Build MSIX
        shell: pwsh
        run: |
          msbuild DotNotes/DotNotes.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:PublishReadyToRun=false `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Always `
            /p:GenerateAppxPackageOnBuild=true `
            /p:GenerateAppInstallerFile=false `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="$env:CERT_THUMBPRINT"

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          Remove-Item `
            "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx" `
            -Force `
            -ErrorAction SilentlyContinue
          Remove-Item `
            "Cert:\CurrentUser\My\$env:CERT_THUMBPRINT" `
            -Force `
            -ErrorAction SilentlyContinue

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: DotNotes-MSIX
          path: |
            DotNotes/AppPackages/**/*.msixbundle
            DotNotes/AppPackages/**/*.cer
          if-no-files-found: error
    
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: DotNotes-MSIX
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.msixbundle
            release/**/*.cer
          generate_release_notes: true
