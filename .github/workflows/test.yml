name: Run Unit Tests
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: msbuild .\DotNotes.slnx /t:Restore /p:RestoreLockedMode=true /m
      - run: dotnet test DotNotes.Tests/DotNotes.Tests.csproj -c Release --no-restore
